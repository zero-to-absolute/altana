<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Корзина — Альтана</title>
    <link rel="stylesheet" href="/src/index.css">
  </head>
  <body class="bg-parchment text-tea-dark font-sans selection:bg-almond-silk selection:text-white min-h-screen flex flex-col">
    <!-- Navigation -->
    <nav id="main-nav" class="sticky top-0 w-full z-50 bg-parchment/90 backdrop-blur-xl py-3 shadow-sm">
      <div class="max-w-7xl mx-auto px-6 flex justify-between items-center">
        <a href="../../" class="flex items-center gap-4 group">
          <div class="w-12 h-12 bg-almond-silk rounded-full flex items-center justify-center text-white">
            <i data-lucide="leaf" size="24"></i>
          </div>
          <span class="text-3xl font-serif font-bold tracking-tight text-tea-dark">Альтана</span>
        </a>

        <div class="hidden md:flex items-center gap-12">
          <a href="../../" class="text-sm uppercase tracking-widest font-bold text-tea-dark/60 hover:text-almond-silk transition-colors">Главная</a>
          <a href="catalog.html" class="text-sm uppercase tracking-widest font-bold text-tea-dark/60 hover:text-almond-silk transition-colors">Каталог</a>
          <a href="constructor.html" class="text-sm uppercase tracking-widest font-bold text-tea-dark/60 hover:text-almond-silk transition-colors">Конструктор</a>
          <a href="about.html" class="text-sm uppercase tracking-widest font-bold text-tea-dark/60 hover:text-almond-silk transition-colors">О нас</a>
        </div>

        <div class="flex items-center gap-6">
          <a href="cart.html" class="p-2.5 hover:bg-bone rounded-full transition-colors relative" aria-label="Корзина">
            <i data-lucide="shopping-bag" size="24"></i>
            <span data-cart-count class="absolute top-0 right-0 w-5 h-5 bg-almond-silk text-white text-[10px] flex items-center justify-center rounded-full">0</span>
          </a>
          <div id="auth-buttons"></div>
        </div>
      </div>
    </nav>

    <main class="flex-1 py-12 md:py-16">
      <div class="max-w-7xl mx-auto px-6">
        <nav class="crumbs mb-10">
          <a href="../../">Главная</a>
          <span class="sep">/</span>
          <span class="text-tea-dark/70">Корзина</span>
        </nav>

        <header class="mb-10">
          <span class="text-almond-silk uppercase tracking-widest text-[10px] font-bold mb-3 block">Ваш заказ</span>
          <h1 class="text-4xl md:text-5xl font-serif text-tea-dark">
            Корзина <span id="cart-counter" class="text-tea-dark/30 font-serif text-2xl ml-2"></span>
          </h1>
        </header>

        <!-- Loading -->
        <div id="cart-loading" class="py-20 text-center">
          <div class="inline-block w-8 h-8 border-2 border-almond-silk border-t-transparent rounded-full animate-spin"></div>
          <p class="mt-4 text-xs uppercase tracking-widest text-tea-dark/40">Загрузка корзины...</p>
        </div>

        <!-- Заполненная корзина: 2 колонки -->
        <div id="cart-content" class="hidden grid grid-cols-1 lg:grid-cols-3 gap-12">
          <!-- Список позиций -->
          <div id="cart-items" class="lg:col-span-2 space-y-4"></div>

          <!-- Sticky сводка «Итого» -->
          <aside class="lg:sticky lg:top-28 self-start">
            <div class="bg-white border border-bone p-8 space-y-6">
              <h2 class="text-xl font-serif text-tea-dark border-b border-bone pb-4">Ваш заказ</h2>

              <div class="space-y-3 text-sm">
                <div class="flex justify-between">
                  <span class="text-tea-dark/60">Подытог</span>
                  <span id="cart-subtotal" class="font-medium tabular-nums">0 ₽</span>
                </div>
              </div>

              <div class="border-t border-bone pt-4 flex justify-between items-baseline">
                <span class="text-[10px] uppercase tracking-widest font-bold text-tea-dark/60">Итого</span>
                <span id="cart-total" class="text-2xl font-serif text-tea-dark tabular-nums">0 ₽</span>
              </div>

              <a id="checkout-btn" href="checkout.html" class="btn-primary w-full inline-flex items-center justify-center gap-3">
                <span>Оформить заказ</span>
                <i data-lucide="arrow-right" class="w-4 h-4"></i>
              </a>

              <p class="text-[10px] text-tea-dark/40 text-center leading-relaxed">
                Заказ оформляется на самовывоз из магазина.
              </p>
            </div>
          </aside>
        </div>

        <!-- Пустая корзина -->
        <div id="cart-empty" class="hidden bg-white border border-dashed border-bone py-24 px-6 text-center">
          <div class="w-20 h-20 mx-auto mb-6 flex items-center justify-center text-almond-silk breathe">
            <i data-lucide="leaf" class="w-16 h-16"></i>
          </div>
          <h2 class="text-3xl font-serif text-tea-dark mb-3">Корзина <span class="italic">пуста</span></h2>
          <p class="text-tea-dark/50 mb-8 max-w-md mx-auto leading-relaxed">
            Добавьте чай из каталога, чтобы оформить заказ.
          </p>
          <a href="catalog.html" class="btn-primary inline-flex items-center gap-3">
            <span>В каталог</span>
            <i data-lucide="arrow-right" class="w-4 h-4"></i>
          </a>
        </div>

        <!-- Error -->
        <div id="cart-error" class="hidden text-red-400 text-sm"></div>
      </div>
    </main>

    <!-- Scripts -->
    <script type="module" src="/src/js/main.js"></script>
    <script type="module" src="/src/js/cart/cart.js"></script>
  </body>
</html>
